name: Scheduled Instagram publish

on:
  schedule:
    - cron: '7,10,37,50 * * * *'  # 10 и 50 — под слоты серии C 8:50/13:10/17:50 Пермь
  workflow_dispatch: {}

jobs:
  trigger-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Call scheduled-publish endpoint
        run: |
          curl -sf "https://zheludkin-apd-stroy-bot-ce16.twc1.net/cron/scheduled-publish?secret=${{ secrets.CRON_SECRET }}"
